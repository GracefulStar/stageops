name: Python and PostgreSQL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: stageops-test
          POSTGRES_DB: stageops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      STAGEOPS_TEST_DATABASE_URL: postgresql+psycopg://postgres:stageops-test@localhost:5432/stageops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci --no-audit --no-fund
      - run: npm run build:frontend
      - run: uv sync --project backend --frozen
      - run: backend/.venv/bin/ruff check backend
      - run: backend/.venv/bin/pytest backend/tests -q
